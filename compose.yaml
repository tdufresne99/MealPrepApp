name: ${COMPOSE_PROJECT_NAME:?Select an environment file}

x-api: &api
  image: ${COMPOSE_PROJECT_NAME}-api:local
  build:
    context: .
  environment:
    ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:?Select an environment}
    ASPNETCORE_HTTP_PORTS: "8080"
    Database__Host: db
    Database__Name: ${POSTGRES_DB:?Set database name}
    Database__Username: ${POSTGRES_USER:?Set database user}
    Database__PasswordFile: /run/secrets/postgres_password
  secrets:
    - postgres_password
  depends_on:
    db:
      condition: service_healthy

services:
  api:
    <<: *api
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:?Set API port}:8080"
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["--migrate"]
    profiles: [tools]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set database user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${DB_PASSWORD_FILE:?Set external password file}
